spring.application.name=Cart service

spring.datasource.url=jdbc:postgresql://localhost:5432/cart-service-db
spring.datasource.username=root
spring.datasource.password=root

spring.profiles.active=dev

spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
server.port=8085

# gRPC client configuration
grpc.client.product-service.address=static://localhost:9090
grpc.client.product-service.negotiation-type=plaintext

# Kafka topics (defaults)
kafka.topic.product-deleted=product.deleted
kafka.topic.variant-price-changed=variant.price.changed
kafka.topic.variant-stock-changed=variant.stock.changed
kafka.topic.variant-deleted=variant.deleted
kafka.topic.variant-image-updated=variant.image.updated





