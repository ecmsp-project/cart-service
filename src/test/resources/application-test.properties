spring.application.name=Cart service Test

# H2 in-memory database for testing
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA/Hibernate settings for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=true
spring.h2.console.enabled=true

# Disable Kafka for testing
spring.kafka.bootstrap-servers=

# gRPC client configuration (mocked in tests)
grpc.client.product-service.address=static://localhost:9090
grpc.client.product-service.negotiation-type=plaintext

# Logging
logging.level.com.ecmsp.cartservice=DEBUG
logging.level.org.springframework.transaction=DEBUG